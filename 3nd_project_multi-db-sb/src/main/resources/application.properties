spring.application.name=multi-db-sb

# PostgreSQL
spring.datasource.postgres.jdbc-url=jdbc:postgresql://localhost:5432/userdb
spring.datasource.postgres.username=postgres
spring.datasource.postgres.password=secretpassword
spring.datasource.postgres.driver-class-name=org.postgresql.Driver

# Oracle
spring.datasource.oracle.jdbc-url=jdbc:oracle:thin:@//localhost:1521/FREEPDB1
spring.datasource.oracle.username=SYSTEM
spring.datasource.oracle.password=secretpassword
spring.datasource.oracle.driver-class-name=oracle.jdbc.OracleDriver

# H2
spring.datasource.h2.jdbc-url=jdbc:h2:mem:bankdb;DB_CLOSE_DELAY=-1
spring.datasource.h2.username=sa
spring.datasource.h2.password=
spring.datasource.h2.driver-class-name=org.h2.Driver

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console