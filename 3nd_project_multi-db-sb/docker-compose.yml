services:
  postgres-db:
    image: postgres:15-alpine
    container_name: postgres_datasource
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  oracle-db:
    image: gvenzl/oracle-free:23-slim
    container_name: oracle_datasource
    environment:
      ORACLE_PASSWORD: secretpassword
    ports:
      - "1521:1521"
    volumes:
      - oracledata:/opt/oracle/oradata

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_console
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres-db

  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    container_name: cloudbeaver_console
    ports:
      - "8978:8978"
    volumes:
      - cloudbeaverdata:/opt/cloudbeaver/workspace
    depends_on:
      - oracle-db
      - postgres-db

volumes:
  pgdata:
  oracledata:
  cloudbeaverdata: